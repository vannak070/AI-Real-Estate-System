name: era-real-estate

services:
  postgres:
    image: postgres:16-alpine
    container_name: era-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: era
      POSTGRES_PASSWORD: era
      POSTGRES_DB: era
    ports:
      # host:container — 5432/5433/5434 are already taken by other projects
      # on this machine, so this project gets its own on 5435.
      - '5435:5432'
    volumes:
      - era_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U era -d era']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  era_postgres_data:
